<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>decyde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* purple, teal, grey. Old names kept as roles: green = confirm/answered (teal),
     amber = needs you (purple), red = blocking (bright purple), cyan = labels (teal). */
  --bg: #0c0b12; --panel: #13121b; --panel-2: #1a1925; --line: #2a2838;
  --text: #cfcfd8; --dim: #767685; --faint: #3d3b4d;
  --green: #4fd1c5; --amber: #a78bfa; --red: #e0aaff; --cyan: #2fb3a6; --violet: #c4b5fd;
  --claude: #d8b4fe; --codex: #5eead4; --grok: #e4e4e7; --antigravity: #2dd4bf; --gemini: #2dd4bf; --other: #a78bfa;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.55 var(--mono); }
body { min-height: 100vh; background-image: radial-gradient(ellipse at top, #1a1430 0%, var(--bg) 60%); }
::selection { background: #2b3b55; }

header { position: sticky; top: 0; z-index: 5; background: rgba(12,11,18,.92); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .08em; color: var(--amber); white-space: nowrap; }
.brand .prompt { color: var(--dim); font-weight: 400; }
.cursor { display: inline-block; width: .6em; height: 1.05em; background: var(--green); vertical-align: -2px; margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stats { display: flex; gap: 14px; color: var(--dim); }
.stats b { color: var(--text); font-weight: 500; }
.stats .hot b { color: var(--amber); }
.spacer { flex: 1; }
.live { color: var(--dim); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.live.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: #0f2e2b; border-color: #1f6b63; color: var(--green); }
button.primary:hover { border-color: var(--green); }
button.ghost { background: transparent; color: var(--dim); }
button:disabled { opacity: .5; cursor: default; }

.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); padding: 8px 12px; }
.tab.active { color: var(--text); border-bottom-color: var(--green); }
.tab .n { color: var(--faint); margin-left: 4px; }
.tab.active .n { color: var(--dim); }

main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 80px; }
.empty { color: var(--dim); padding: 60px 0; text-align: center; }
.empty pre { color: var(--faint); margin: 0 0 14px; font: inherit; line-height: 1.2; }

.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--faint); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.card.open { border-left-color: var(--amber); }
.card.open.high { border-left-color: var(--red); }
.card.answered, .card.acknowledged { border-left-color: var(--green); }
.card.cancelled { opacity: .55; }
.card.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 1px var(--amber), 0 0 24px rgba(167,139,250,.4); } 100% { box-shadow: none; } }

.head { display: flex; gap: 10px; align-items: baseline; padding: 11px 14px; cursor: pointer; flex-wrap: wrap; }
.id { color: var(--faint); }
.agent { font-weight: 700; text-transform: lowercase; }
.title { color: #e6edf3; font-weight: 500; flex: 1 1 320px; min-width: 0; }
.meta { color: var(--dim); white-space: nowrap; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.pill.high { color: var(--red); border-color: #5b3b7a; }
.pill.open { color: var(--amber); border-color: #3f3566; }
.pill.answered, .pill.acknowledged { color: var(--green); border-color: #1d4d48; }

.body { border-top: 1px dashed var(--line); padding: 12px 14px 14px; display: none; }
.card.expanded .body { display: block; }
.who { color: var(--dim); margin-bottom: 10px; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
.who span:nth-child(odd) { color: var(--faint); }
.who span { overflow-wrap: anywhere; }
.label { color: var(--cyan); margin: 12px 0 4px; }
.label::before { content: "## "; color: var(--faint); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; color: #e6edf3; }
.text.ctx { color: var(--text); }
.rec { color: var(--violet); white-space: pre-wrap; }
.options { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.opt { text-align: left; background: var(--panel-2); white-space: pre-wrap; }
.opt .k { color: var(--amber); margin-right: 8px; }
.opt.sel { border-color: var(--amber); }

.reply { margin-top: 14px; }
.reply .ps { color: var(--green); margin-bottom: 4px; }
textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; color: var(--text); background: #0a0d12; border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; outline: none; }
textarea:focus { border-color: #6d5bd0; box-shadow: 0 0 0 1px #6d5bd0; }
.actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.hint { color: var(--faint); margin-left: auto; }
.answer { background: #0e1b1a; border: 1px solid #1d3d3a; border-radius: 4px; padding: 9px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.delivery { color: var(--dim); margin-top: 6px; }
.delivery b { color: var(--text); font-weight: 500; }

@media (max-width: 640px) {
  .meta.when { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="prompt" id="prompt">~$</span> decyde<span class="cursor"></span></div>
    <div class="stats">
      <span class="hot">open <b id="s-open">0</b></span>
      <span>high <b id="s-high">0</b></span>
      <span>awaiting ack <b id="s-await">0</b></span>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="notif-btn" hidden>enable alerts</button>
    <div class="live" id="live"><span class="dot"></span><span id="live-text">offline</span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="list"></main>

<script>
const TABS = [
  ["open", "needs you", q => q.status === "open"],
  ["answered", "answered", q => q.status === "answered" || q.status === "acknowledged"],
  ["all", "history", () => true],
];
let ME = "you", tab = "open", questions = [], expanded = new Set(), drafts = {}, known = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

async function load() {
  const r = await fetch("/api/questions");
  const data = await r.json();
  const fresh = [];
  if (known) for (const q of data) if (!known.has(q.id) && q.status === "open") fresh.push(q);
  known = new Set(data.map(q => q.id));
  questions = data;
  for (const q of fresh) expanded.add(q.id);
  if (fresh.length) alertNew(fresh);
  render(new Set(fresh.map(q => q.id)));
}

function render(freshIds = new Set()) {
  const open = questions.filter(q => q.status === "open");
  $("#s-open").textContent = open.length;
  $("#s-high").textContent = open.filter(q => q.urgency === "high").length;
  $("#s-await").textContent = questions.filter(q => q.status === "answered").length;
  document.title = open.length ? `(${open.length}) decyde` : "decyde";

  $("#tabs").innerHTML = TABS.map(([k, label, f]) =>
    `<button class="tab ${k === tab ? "active" : ""}" data-tab="${k}">${label}<span class="n">${questions.filter(f).length}</span></button>`).join("");

  // Keep in-progress answers when the list re-renders.
  document.querySelectorAll("textarea[data-id]").forEach(t => drafts[t.dataset.id] = t.value);
  const focused = document.activeElement?.dataset?.id;

  let items = questions.filter(TABS.find(t => t[0] === tab)[2]);
  if (tab === "open") items.sort((a, b) => (b.urgency === "high") - (a.urgency === "high") || a.id - b.id);

  if (!items.length) {
    $("#list").innerHTML = `<div class="empty"><pre>  _\n ( )\n  X   all clear\n / \\</pre>${tab === "open" ? "No agent is waiting on you." : "Nothing here yet."}</div>`;
    return;
  }
  $("#list").innerHTML = items.map(q => card(q, freshIds.has(q.id))).join("");
  if (focused) { const t = document.querySelector(`textarea[data-id="${focused}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
}

function card(q, fresh) {
  const isOpen = q.status === "open";
  const cls = ["card", q.status, q.urgency, expanded.has(q.id) || (isOpen && tab === "open") ? "expanded" : "", fresh ? "fresh" : ""].join(" ");
  const who = [
    ["agent", `${q.agent}${q.agent_name ? " / " + q.agent_name : ""}`],
    ["working on", q.task],
    ["project", q.project + (q.git_branch ? `  (${q.git_branch})` : "")],
    ["cwd", q.cwd],
    ["herdr pane", q.herdr_pane || "none"],
    ["asked", new Date(q.created_at).toLocaleString()],
  ].map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join("");
  const opts = q.options.length ? `<div class="label">options</div><div class="options">${q.options.map((o, i) =>
      `<button class="opt" ${isOpen ? "" : "disabled"} data-pick="${q.id}" data-val="${esc(o)}"><span class="k">[${i + 1}]</span>${esc(o)}</button>`).join("")}</div>` : "";
  let tail;
  if (isOpen) {
    tail = `<div class="reply"><div class="ps">${esc(ME.toLowerCase())} &gt; your call</div>
      <textarea data-id="${q.id}" placeholder="Type your decision. ${q.options.length ? "Pick an option above or write your own. " : ""}Cmd+Enter to send.">${esc(drafts[q.id] || "")}</textarea>
      <div class="actions"><button class="primary" data-send="${q.id}">send answer</button>
      <button class="ghost" data-dismiss="${q.id}">dismiss</button><span class="hint">Cmd+Enter sends</span></div></div>`;
  } else {
    const d = q.delivery ? `<div class="delivery">delivery: <b>${esc(q.delivery)}</b>${q.acknowledged_at ? ` · agent acknowledged ${ago(q.acknowledged_at)}` : ""}</div>` : "";
    tail = `<div class="label">${q.status === "cancelled" ? "closed" : "your answer"}</div><div class="answer">${esc(q.answer)}</div>${d}`;
  }
  return `<article class="${cls}" id="q${q.id}">
    <div class="head" data-toggle="${q.id}">
      <span class="id">#${q.id}</span>
      <span class="agent" style="color:var(--${["claude","codex","grok","antigravity","gemini"].includes(q.agent) ? q.agent : "other"})">${esc(q.agent)}</span>
      <span class="title">${esc(q.title)}</span>
      ${q.urgency === "high" && isOpen ? `<span class="pill high">blocking</span>` : ""}
      <span class="pill ${q.status}">${q.status}</span>
      <span class="meta when">${ago(q.created_at)}</span>
    </div>
    <div class="body">
      <div class="who">${who}</div>
      <div class="label">question</div><div class="text">${esc(q.question)}</div>
      ${q.context ? `<div class="label">context</div><div class="text ctx">${esc(q.context)}</div>` : ""}
      ${opts}
      ${q.recommendation ? `<div class="label">agent recommends</div><div class="rec">${esc(q.recommendation)}</div>` : ""}
      ${tail}
    </div>
  </article>`;
}

async function post(id, action, body = {}) {
  const r = await fetch(`/api/questions/${id}/${action}`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const res = await r.json();
  if (!r.ok) { alertInline(id, res.error || "failed"); return; }
  delete drafts[id];
  await load();
}
function alertInline(id, msg) {
  const a = document.querySelector(`#q${id} .actions`);
  if (a) a.insertAdjacentHTML("beforeend", `<span style="color:var(--red)">${esc(msg)}</span>`);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-toggle],[data-pick],[data-send],[data-dismiss]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.toggle) { const id = +t.dataset.toggle; expanded.has(id) ? expanded.delete(id) : expanded.add(id); document.getElementById("q" + id).classList.toggle("expanded"); }
  else if (t.dataset.pick) { const ta = document.querySelector(`textarea[data-id="${t.dataset.pick}"]`); ta.value = t.dataset.val; ta.focus(); }
  else if (t.dataset.send) { const ta = document.querySelector(`textarea[data-id="${t.dataset.send}"]`); if (ta.value.trim()) { t.disabled = true; post(t.dataset.send, "answer", { answer: ta.value }); } else ta.focus(); }
  else if (t.dataset.dismiss) post(t.dataset.dismiss, "dismiss");
});
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea[data-id]") && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); document.querySelector(`[data-send="${e.target.dataset.id}"]`).click();
  }
});

// Alerts: chime + desktop notification when a new question lands while the tab is in the background.
let audio;
function chime() {
  try {
    audio = audio || new AudioContext();
    [660, 880].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime + i * 0.14;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}
function alertNew(qs) {
  chime();
  if ("Notification" in window && Notification.permission === "granted" && document.hidden)
    for (const q of qs) new Notification(`${q.agent} needs a decision`, { body: q.title, tag: "dhub" + q.id });
}
if ("Notification" in window && Notification.permission === "default") {
  const b = $("#notif-btn"); b.hidden = false;
  b.onclick = () => Notification.requestPermission().then(() => { b.hidden = true; });
}

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("hello", () => { $("#live").classList.add("on"); $("#live-text").textContent = "live"; load(); });
  es.addEventListener("changed", load);
  es.onerror = () => { $("#live").classList.remove("on"); $("#live-text").textContent = "reconnecting"; };
}
setInterval(() => document.querySelectorAll(".meta.when").length && render(), 60000);
fetch("/api/meta").then(r => r.json()).then(m => { ME = m.name || ME; $("#prompt").textContent = `${ME.toLowerCase()}@${m.host}:~$`; render(); });
connect();
</script>
</body>
</html>
